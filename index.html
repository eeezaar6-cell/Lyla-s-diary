<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyla's Diary</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      text-align: center;
      font-family: Arial, sans-serif;
      padding: 24px 12px;
    }

    h1 {
      color: #d4af37;
      margin-top: 25px;
    }

    video {
      display: block;
      width: 100%;
      max-width: 700px;
      height: auto;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 18px;
      margin: 25px auto;
      background: #000;
    }

    p {
      color: #d4af37;
    }
  </style>
</head>

<body>
  <h1>Lyla's Diary</h1>

  <video controls autoplay muted playsinline loop>
    <source src="./Lyla.mp4" type="video/mp4">
    Your browser does not support HTML video.
  </video>

  <p>For my Lyla...</p>
</body>
</html>
